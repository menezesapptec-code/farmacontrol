<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Farma Control</title>
<meta name="theme-color" content="#12382A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312382A'/%3E%3Cpath d='M32 14v36M14 32h36' stroke='%23F4C20D' stroke-width='10' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --outer:#D3DCD2; --bg:#E9EEE8; --surface:#FFFFFF; --surface2:#F1F5F0;
  --ink:#14201A; --muted:#556459; --line:#D1DAD0;
  --hdr:#12382A; --hdr-ink:#F2F7F3; --brand:#1B6B47;
  --cta:#F4C20D; --cta-ink:#1A1600;
  --ok:#1E7A4A; --ok-bg:#DDF1E4;
  --warn:#A94C08; --warn-bg:#FCE9D6;
  --crit:#B3261E; --crit-bg:#FADAD7;
  --info:#1B5E9B; --info-bg:#DCEAF7;
  --strip:#0B100D; --strip-ink:#CDD7CF; --seg-bg:#1C261F; --seg-on:#EEF4EF; --seg-on-ink:#12382A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --outer:#070B09; --bg:#0E1511; --surface:#17211B; --surface2:#1E2A23;
    --ink:#E6EEE8; --muted:#9BAEA1; --line:#2B3A31;
    --hdr:#0A2018; --hdr-ink:#EAF3EC; --brand:#7ED3A2;
    --ok:#6FD39A; --ok-bg:#16372A; --warn:#F0A25C; --warn-bg:#3C2812;
    --crit:#F2918A; --crit-bg:#431B18; --info:#8DBBEA; --info-bg:#172B40;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--outer);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.px{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.device{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:640px){
  body{padding-block:12px}
  .device{border-radius:26px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.2)}
  body.dsk{padding-block:0}
}
/* Painéis de gerência e administrador: tela cheia de notebook. O app do responsável continua em coluna de celular. */
.device.desktop{max-width:none;margin:0;border:0;border-radius:0;box-shadow:none}
.app{flex:1;min-height:0;display:flex;flex-direction:column}
.strip{background:var(--strip);color:var(--strip-ink);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;padding-block:7px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.seg{display:inline-flex;background:var(--seg-bg);border-radius:99px;padding:2px;align-items:center}
.seg button,.seg select{border:0;background:transparent;color:var(--strip-ink);font-size:12px;letter-spacing:0;text-transform:none;padding:4px 11px;border-radius:99px;min-height:28px}
.seg select{background:var(--seg-bg)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--seg-on-ink);font-weight:600}
.strip-ctl{display:flex;gap:8px;flex-wrap:wrap}
.hdr{background:var(--hdr);color:var(--hdr-ink);padding-block:12px 14px}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.hdr-sub{font-size:13px;opacity:.82;margin-top:3px}
.hdr .back{background:transparent;border:0;color:var(--hdr-ink);display:flex;align-items:center;gap:6px;min-height:44px;min-width:44px;margin-left:-8px;padding:0 8px;font-weight:600}
.modal{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox.ficha{max-width:660px;max-height:90vh;overflow:auto}
.gsbar{display:flex;gap:8px;align-items:center;margin-bottom:6px}.gsbar input{flex:1}
.fk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.fk>div{background:rgba(127,127,127,.12);border-radius:10px;padding:8px 10px}.fk small{display:block;opacity:.7;font-size:12px}
.clk{cursor:pointer}
.mbox{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.hdr .out svg{vertical-align:-3px}
.hdr .out{background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--hdr-ink);border-radius:99px;min-height:32px;padding:0 12px;font-size:13px}
.hdr .chips{margin-top:10px}
.hdr .chip{min-height:32px;font-size:13px;padding:0 12px;background:transparent;border-color:rgba(255,255,255,.35);color:var(--hdr-ink)}
.hdr .chip[aria-pressed="true"]{background:var(--cta);color:var(--cta-ink);border-color:transparent}
.hr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}
.steps i{height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
.steps i.on{background:var(--cta)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.info{background:var(--info-bg);color:var(--info)}
.view{flex:1;min-height:0;overflow-y:auto;padding-block:16px 24px;display:flex;flex-direction:column;gap:14px}
.h1{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
.h2{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:17px;padding:10px 16px;text-align:center}
.btn.cta{background:var(--cta);color:var(--cta-ink);border-color:transparent}
.btn.dark{background:var(--hdr);color:var(--hdr-ink);border-color:transparent}
.btn.danger{color:var(--crit)}
.btn.sm{min-height:44px;font-size:15px;width:auto;padding:8px 14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{min-height:84px;font-size:22px;font-family:var(--font-display);letter-spacing:.04em;text-transform:uppercase;flex-direction:column;gap:2px}
.btn.big small{font-family:var(--font-body);font-size:13px;letter-spacing:0;text-transform:none;font-weight:500;opacity:.85}
.badge{background:var(--crit);color:#fff;border-radius:99px;font-size:12px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn{flex-direction:column;min-height:88px;font-size:15px;gap:6px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:96px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);width:100%}
.tile b{font-family:var(--font-display);font-size:24px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.tile[aria-pressed="true"]{border-color:var(--brand);background:var(--surface2)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.opt:disabled{opacity:.5}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.input{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 14px;font-size:20px;width:100%;font-variant-numeric:tabular-nums}
.input.t{font-size:17px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px;font-weight:500}
.chk input{width:22px;height:22px;flex:none}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;align-items:stretch;gap:8px}
.stepper button{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:30px;font-weight:600}
.stepper output{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-family:var(--font-display);font-size:40px;font-weight:700;line-height:1}
.stepper output small{font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--muted)}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:0}
.sumrow span:first-child{color:var(--muted)}
.sumrow span:last-child{text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere}
.note{border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.crit{background:var(--crit-bg);color:var(--crit)}
.note.info{background:var(--info-bg);color:var(--info)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note svg{flex:none;margin-top:1px}
.foot{border-top:1px solid var(--line);background:var(--surface);padding-block:12px}
.bar{height:9px;background:var(--surface2);border-radius:5px;position:relative;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.bar i.low{background:var(--warn)}
.nav{background:var(--surface);border-top:1px solid var(--line);display:grid;gap:4px;padding-block:8px}
.nav.n1{grid-template-columns:1fr}
.nav.n4{grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:12px;font-size:11px;font-weight:600;color:var(--muted);position:relative;min-width:0}
.nav.n4 button{font-size:12px}
.nav button[aria-current="page"]{color:var(--brand)}
.nav button.cta{background:var(--cta);color:var(--cta-ink)}
.nav .badge{position:absolute;top:2px;right:calc(50% - 24px)}
.toast{position:absolute;left:16px;right:16px;bottom:92px;background:var(--hdr);color:var(--hdr-ink);padding:12px 14px;border-radius:12px;font-size:14px;font-weight:500;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.login{flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:24px;background:var(--hdr);color:var(--hdr-ink)}
.login .input{background:#fff;color:#14201A;border-color:transparent}
.login .field label{color:var(--hdr-ink);opacity:.85}
.login .lnk{background:transparent;border:0;color:var(--hdr-ink);text-decoration:underline;min-height:44px;font-size:14px}
.login .err{background:var(--crit-bg);color:var(--crit);border-radius:12px;padding:10px 12px;font-size:14px}
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center}
.btrack{position:relative;height:26px;background:var(--surface2);border-radius:6px;border:1px solid var(--line)}
.btrack i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--brand);opacity:.55}
.btrack i.hi{opacity:1;background:var(--warn)}
.btrack span{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.axis{display:grid;grid-template-columns:62px 1fr;gap:10px;font-size:11px;color:var(--muted)}
.axis div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-family:var(--font-display);font-size:26px;line-height:1.1;font-weight:700;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--hdr);color:var(--hdr-ink);border-color:var(--hdr)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.success{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-top:10px}
.success .tick{width:84px;height:84px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion: no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}}
.splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease}
.splash img{width:min(78vmin,520px);height:auto;display:block}
.splash.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion: reduce){.splash{transition:none}}
.login>*{width:100%;max-width:420px;align-self:center}
.shell{flex:1;min-height:0;display:flex;flex-direction:row}
.side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:16px 12px;overflow-y:auto}
.side button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:16px;font-weight:600;text-align:left;position:relative}
.side button:hover{background:var(--surface2)}
.side button[aria-current="page"]{background:var(--surface2);color:var(--brand)}
.side button .badge{margin-left:auto}
.view.desk{align-content:start;grid-auto-rows:max-content;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-content:start;align-items:start;padding-block:24px 40px;padding-inline:max(24px,calc((100% - 1320px)/2))}
.desk>.h1,.desk>.h2,.desk>.kpis,.desk>.note,.desk>.chips,.desk>.small,.desk>.filters,.desk>.card.full,.desk>.card.empty{grid-column:1/-1}
.desk>.btn{grid-column:1/-1;width:auto;justify-self:start;min-width:240px}
.desk>.h1{font-size:34px}
.desk .span2{grid-column:span 2}
.desktop .hdr.px{padding-left:24px;padding-right:24px}
.desktop .strip.px{padding-left:24px;padding-right:24px}
.desktop .kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.desktop .kpi b{font-size:34px}
.desktop .brow{grid-template-columns:120px 1fr}
.desktop .axis{grid-template-columns:120px 1fr}
.chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.filters .field{min-width:220px}
.card.tbl{padding:0;overflow-x:auto}
.tbl table{width:100%;min-width:760px;border-collapse:collapse;font-size:15px}
.tbl th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 14px;white-space:nowrap}
.tbl td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
.tbl td.dt{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:860px){
  .shell{flex-direction:column-reverse}
  .side{width:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:8px 8px;gap:4px;overflow-x:auto;overflow-y:hidden}
  .side button{flex:1;min-width:64px;flex-direction:column;justify-content:center;gap:2px;min-height:56px;padding:0 6px;font-size:11px;text-align:center}
  .side button .badge{position:absolute;top:2px;right:calc(50% - 24px);margin-left:0}
  .desktop .kpis{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){.desk .span2{grid-column:auto}}
</style>

    if(opts&&opts.order){var f=opts.order[0],dir=opts.order[1]==='desc'?-1:1;o.sort(function(a,b){return (a[f]>b[f]?1:a[f]<b[f]?-1:0)*dir})}
    if(opts&&opts.limit)o=o.slice(0,opts.limit);
    return o;
  }
  function emit(p){subs.forEach(function(s){if(s.path===p)s.cb(arr(p,s.opts),false)})}
  if(DEMO)lsLoad();
  return {
    setFarm:function(f){FID=f},
    isEmpty:function(){return !L.users||!Object.keys(L.users).length},
    reset:function(){L={};lsSave();subs.forEach(function(s){s.cb([],false)})},
    sub:function(col,cb,opts){
      opts=opts||{};var p=path(col);
      if(DEMO){var s={path:p,opts:opts,cb:cb};subs.push(s);cb(arr(p,opts),false);return function(){var i=subs.indexOf(s);if(i>-1)subs.splice(i,1)}}
      var q=fs.collection(p);
      if(opts.where)q=q.where(opts.where[0],opts.where[1],opts.where[2]);
      if(opts.order)q=q.orderBy(opts.order[0],opts.order[1]);
      if(opts.limit)q=q.limit(opts.limit);
      return q.onSnapshot({includeMetadataChanges:true},function(snap){
        cb(snap.docs.map(function(d){return ext({id:d.id,_pend:d.metadata.hasPendingWrites},d.data())}),snap.metadata.fromCache);
      },function(err){console.error(col,err);onSubError(col,err)});
    },
    subDoc:function(col,id,cb,errcb){
      if(DEMO){return this.sub(col,function(docs){cb(byId(docs,id),false)})}
      return fs.collection(path(col)).doc(id).onSnapshot({includeMetadataChanges:true},function(snap){
        cb(snap.exists?ext({id:id},snap.data()):null,snap.metadata.fromCache);
      },function(err){console.error(col,err);if(errcb)errcb(err)});
    },
    setSimOff:function(off){
      simOff=off;
      if(!off){for(var c in L){for(var id in L[c]){delete L[c][id]._pend}}lsSave();Object.keys(L).forEach(emit)}
    },
    batch:function(ops){
      if(DEMO){
        var touched={};
        ops.forEach(function(o){
          var p=path(o.col,o.fid),c=L[p]||(L[p]={});
          if(o.op==='set'){c[o.id]=ext(c[o.id]||{},o.data)}
          else if(o.op==='log'){c[o.id]=ext(ext({},o.data),{em:Date.now()})}
          else if(o.op==='inc'){var d=c[o.id]||(c[o.id]=ext({qtd:0},o.data));d.qtd=(d.qtd||0)+o.n}
          else if(o.op==='del'){delete c[o.id]}
          if(simOff&&c[o.id])c[o.id]._pend=true;
          touched[p]=1;
        });
        lsSave();Object.keys(touched).forEach(emit);
        return Promise.resolve();
      }
      var b=fs.batch();
      ops.forEach(function(o){
        var ref=fs.collection(path(o.col,o.fid)).doc(o.id);
        if(o.op==='set')b.set(ref,o.data,{merge:true});
        else if(o.op==='log')b.set(ref,ext(ext({},o.data),{em:firebase.firestore.FieldValue.serverTimestamp()}));
        else if(o.op==='inc')b.set(ref,ext(ext({},o.data),{qtd:firebase.firestore.FieldValue.increment(o.n)}),{merge:true});
        else if(o.op==='del')b['delete'](ref);
      });
      return b.commit().catch(function(e){console.error(e);toast('Erro ao salvar: '+(e.code||e.message))});
    }
  };
})();

function stats(){
  var since=Date.now()-30*DAY,cons={},heads=0,valor=0,perdas=0,alerts=[],exp=[];
  retiros().forEach(function(r){cons[r.id]=0;heads+=r.cabecas||0});
  D.launches.forEach(function(l){if(l.st!=='cancelado'&&l.ts>=since&&cons[l.retiro]!=null)cons[l.retiro]+=l.custo||0});
  D.stock.forEach(function(s){var m=medById(s.med);if(m)valor+=(s.qtd||0)*m.preco/m.frasco});
  D.approvals.forEach(function(a){if(a.tipo==='Perda'&&a.st==='ok'&&a.ts>=since)perdas+=(a.payload&&a.payload.valor)||0});
  retiros().forEach(function(r){D.meds.forEach(function(m){var q=qty(r.id,m.id);if(q<m.min)alerts.push({r:r,m:m,q:q})})});
  D.meds.forEach(function(m){var d=daysTo(m.venc);if(d<=30){var tot=0;D.stock.forEach(function(s){if(s.med===m.id)tot+=s.qtd||0});if(tot>0)exp.push({m:m,d:d})}});
  return {cons:cons,heads:heads,valor:valor,perdas:perdas,alerts:alerts,exp:exp};
}

var scanTarget=null;
function mqRun(q){
  q=String(q||'').trim();S.mq=q;
  if(isCode(q)){
    S.pendCode=q;
    var own=ownByCode(q),f=catFind(q);
    if(!own&&f.length===1){catUse(f[0].id);return}
  }
  render(true);
}
function catUse(id){
  var c=byId(D.catalogo,id);if(!c)return;
  var code=S.pendCode||'';
  var d={nome:c.nome,lab:c.lab,cat:c.cat,frasco:c.frasco,catId:c.id,conf:!!c.conferido,
    barcode:code||((c.barcodes||[])[0]||''),codeNew:!!code&&(c.barcodes||[]).indexOf(code)<0};
  if(c.conferido){d.kgMl=c.kgMl;d.fixo=c.fixo;d.carencia=c.carencia}
  S.medDraft=d;S.medEdit='novo';S.pendCode='';
  toast(c.conferido?'Preenchido pelo catálogo. Falta lote, validade, preço e mínimo.':'Preenchido. Dose e carência ainda não foram conferidas: confira na bula.');
  render(true);
}
function scanOpen(){
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Este navegador não lê código pela câmera. Use o leitor USB ou digite o código.');return}
  var d=document.createElement('div');d.className='modal';d.id='scanm';
  d.innerHTML='<div class="mbox"><div class="h2">Aponte para o código de barras</div><video id="scanv" playsinline muted style="width:100%;border-radius:12px;background:#000"></video><button class="btn" data-act="scanClose">Cancelar</button></div>';
  document.body.appendChild(d);
  var det,stream=null,timer=null;
  try{det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']})}catch(e){document.body.removeChild(d);toast('Este navegador não lê código pela câmera.');return}
  scanStop=function(){clearInterval(timer);if(stream)stream.getTracks().forEach(function(t){t.stop()});var m=document.getElementById('scanm');if(m&&m.parentNode)m.parentNode.removeChild(m);scanStop=function(){}};
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(st){
    stream=st;var v=document.getElementById('scanv');if(!v){scanStop();return}
    v.srcObject=st;v.play();
    timer=setInterval(function(){det.detect(v).then(function(r){if(r&&r.length){var code=r[0].rawValue;scanStop();(scanTarget||mqRun)(code)}}).catch(function(){})},350);
  }).catch(function(){scanStop();toast('Não consegui abrir a câmera. Confira a permissão do navegador.')});
}
function mqResults(){
  var q=S.mq;if(!q)return '';
  var h='';
  if(isCode(q)){
    var own=ownByCode(q);
    if(own)return '<div class="note info">'+ic('check',20)+'<div>Este código já está cadastrado na sua fazenda: <b>'+esc(own.nome)+'</b>. <button class="btn sm" data-act="medEdit" data-v="'+esc(own.id)+'">Abrir cadastro</button></div></div>';
  }
  var f=catFind(q).slice(0,8);
  if(!isCode(q)&&S.pendCode)h+='<div class="small muted">O código <b>'+esc(S.pendCode)+'</b> será ligado ao produto que você escolher.</div>';
  if(!f.length){
    return h+'<div class="note warn">'+ic('alert',20)+'<div>'+(isCode(q)?'Código <b>'+esc(q)+'</b> novo, ainda não está no catálogo. Procure o produto pelo nome para ligar o código a ele, ou preencha abaixo.':'Nenhum produto com esse nome no catálogo. Preencha abaixo; o cadastro será enviado como sugestão para o catálogo.')+'</div></div>';
  }
  if(isCode(q))h+='<div class="small muted">Código '+esc(q)+' encontrado:</div>';
  f.forEach(function(c){
    h+='<div class="card row sb"><div class="grow"><b>'+esc(c.nome)+'</b><div class="small muted">'+esc(c.lab)+' · '+tipoNome(c.cat)+(c.frasco?' · frasco '+c.frasco+' mL':'')+'</div></div>'+(c.conferido?'<span class="pill ok">Conferido</span>':'<span class="pill warn">Dose a conferir</span>')+'<button class="btn sm cta" data-act="catUse" data-v="'+esc(c.id)+'">Usar este</button></div>';

  return h;
}

var ATV_CACHE={};
function findAtv(txt){
  var t=' '+norm(txt)+' ',out=[];
  Object.keys(ATV).forEach(function(k){
    for(var i=0;i<ATV[k].length;i++){var v=ATV[k][i].trim();if(!v)continue;
      var re=new RegExp('(?:^|[^a-z])'+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![a-z])');
      if(re.test(t)){out.push(k);break}}
  });
  return out;
}
function catDe(m){
  if(!m)return null;
  var c=m.catId&&byId(D.catalogo,m.catId);
  if(!c&&m.barcode)c=D.catalogo.filter(function(x){return (x.barcodes||[]).indexOf(m.barcode)>-1})[0];
  if(!c){var n=norm(m.nome);c=D.catalogo.filter(function(x){return norm(x.nome)===n})[0]}
  return c||null;
}
function ativosDe(m){
  var own=Array.isArray(m.ativos)?m.ativos:[];
  if(own.length)return own;
  var k=m.id+'|'+D.catalogo.length+'|'+m.nome;
  if(ATV_CACHE[k])return ATV_CACHE[k];
  var c=catDe(m),a=(c&&c.ativos&&c.ativos.length)?c.ativos.slice():findAtv(m.nome+' '+(m.lab||''));
  ATV_CACHE[k]=a;return a;
}
function locTxt(m){return [m.pasta,m.fila].filter(Boolean).join(' · ')}
function doseMed(m){
  if(isMat(m))return 'Material veterinário: não tem dose.';
  if(m.fixo)return m.fixo+' mL por animal (dose fixa, qualquer peso)';
  if(m.kgMl){var ex=[100,300,450].map(function(p){return p+' kg = '+num(Math.max(1,Math.round(p/m.kgMl)))+' mL'});return '1 mL a cada '+m.kgMl+' kg de peso. Exemplos: '+ex.join(' · ')}
  return 'Dose não cadastrada. Consulte a bula ou o veterinário.';
}
function qEscopo(m,ret){
  if(ret)return qty(ret==='central'?'central':ret,m.id);
  var t=qty('central',m.id);retiros().forEach(function(r){t+=qty(r.id,m.id)});return t;
}
function alternativas(m,ret){
  var A=ativosDe(m);if(!A.length)return [];
  var out=[];
  D.meds.forEach(function(x){
    if(x.id===m.id)return;
    var B=ativosDe(x);if(!B.length)return;
    var ok=A.every(function(a){return B.indexOf(a)>-1});if(!ok)return;
    var q=qEscopo(x,ret);if(q<=0)return;
    out.push({m:x,q:q,exato:B.length===A.length});
  });
  out.sort(function(a,b){return (b.exato-a.exato)||(b.q-a.q)});
  return out.slice(0,5);
}
function medMatch(q){
  var tk=norm(q).split(/\s+/).filter(Boolean);if(!tk.length)return D.meds.slice();
  return D.meds.filter(function(m){var h=norm(m.nome+' '+(m.lab||'')+' '+ativosDe(m).join(' ')+' '+(m.barcode||''));return tk.every(function(t){return h.indexOf(t)>-1})});
}
/* caixa de busca dentro de Enviar/Retirada: filtra o produto e sugere alternativas com o mesmo princípio ativo quando não há estoque na central */
function pickBox(id,q,medId,needBase,act){
  var m=medById(medId),h='<div class="field"><label for="'+id+'">Buscar produto</label><input class="input t" id="'+id+'" data-keep type="search" autocomplete="off" placeholder="Digite o nome, laboratório ou princípio ativo" value="'+esc(q)+'"></div>';
  if(q.trim()&&!medMatch(q).length)h+='<div class="note info"><div>Nenhum produto encontrado com “'+esc(q)+'”.</div></div>';
  if(m&&q.trim()&&medMatch(q).length){
    var disp=qty('central',m.id);
    if(disp<=0||disp<needBase){
      var alt=alternativas(m,'central'),A=ativosDe(m);
      h+='<div class="note warn">'+ic('alert',20)+'<div><b>'+(disp<=0?'Sem estoque na central':'Estoque insuficiente na central')+': '+esc(m.nome)+'.</b> '+

function gsRes(ret){
  var q=S.gq.trim(),tk=norm(q).split(/\s+/).filter(Boolean);
  var found=D.meds.filter(function(m){
    var h=norm(m.nome+' '+(m.lab||'')+' '+ativosDe(m).join(' ')+' '+(m.barcode||''));
    return tk.every(function(t){return h.indexOf(t)>-1});
  }).sort(function(a,b){return qEscopo(b,ret)-qEscopo(a,ret)||a.nome.localeCompare(b.nome)});
  var h='<div class="h2">'+found.length+' resultado'+(found.length===1?'':'s')+' para “'+esc(q)+'”</div>';
  if(!found.length){
    h+='<div class="card empty">Nenhum remédio cadastrado com esse nome. Confira a grafia ou tente o princípio ativo (ex.: ivermectina).</div>';
    return h;
  }
  found.slice(0,10).forEach(function(m){
    var tot=qEscopo(m,ret),has=tot>0;
    h+='<div class="card stack"><div class="row sb"><b class="clk" data-act="ficha" data-v="'+esc(m.id)+'">'+esc(m.nome)+'</b>'+(has?'<span class="pill ok">Tem estoque</span>':'<span class="pill crit">Sem estoque</span>')+'</div>'+
      stockLinha(m,ret)+
      '<div class="small"><b>Dose:</b> '+esc(doseMed(m))+'</div>'+
      (m.carencia?'<div class="small muted">Carência: '+m.carencia+' dias para abate</div>':'')+
      '<button class="btn sm" style="align-self:flex-start" data-act="ficha" data-v="'+esc(m.id)+'">Abrir ficha</button>';
    if(!has){
      var alt=alternativas(m,ret),A=ativosDe(m);
      if(alt.length){
        h+='<div class="note warn">'+ic('alert',20)+'<div><b>Sem estoque. Alternativa com o mesmo princípio ativo ('+esc(A.join(' + '))+'):</b>'+
          alt.map(function(a){return '<div style="margin-top:6px"><span class="clk" data-act="ficha" data-v="'+esc(a.m.id)+'"><b>'+esc(a.m.nome)+'</b></span> · tem '+qs(a.q,a.m)+(a.exato?'':' · <i>combinação com outros ativos</i>')+'<div class="small">Dose: '+esc(doseMed(a.m))+'</div></div>'}).join('')+
          '<div class="small muted" style="margin-top:6px">Confira a concentração e a carência na bula e fale com o veterinário antes de trocar.</div></div></div>';
      }else if(A.length)h+='<div class="note info"><div>Sem estoque e nenhum outro remédio cadastrado tem o mesmo princípio ativo ('+esc(A.join(' + '))+') disponível.</div></div>';
      else h+='<div class="note info"><div>Sem estoque. O princípio ativo deste produto não está identificado, então não dá para sugerir alternativa automática. Fale com o veterinário.</div></div>';
    }
    h+='</div>';
  });

  return h;
}

function gRetiros(){
  var R=retiros(),h='<div class="h1">Retiros e seus estoques</div>';
  if(!R.length)return h+'<div class="card empty">Nenhum retiro cadastrado.</div>';
  if(!byId(R,S.rtSel))S.rtSel=R[0].id;
  var lowN={};R.forEach(function(r){var n=0;D.meds.forEach(function(m){if(qty(r.id,m.id)<(m.min||0))n++});lowN[r.id]=n});
  h+='<div class="chips" role="group" aria-label="Retiro">'+R.map(function(r){return '<button class="chip" data-act="rtSel" data-v="'+esc(r.id)+'" aria-pressed="'+(S.rtSel===r.id)+'">'+esc(r.nome)+(lowN[r.id]?' · '+lowN[r.id]+' baixo':'')+'</button>'}).join('')+'</div>';
  var r=byId(R,S.rtSel),val=0,com=0;
  D.meds.forEach(function(m){var q=qty(r.id,m.id);if(q>0){com++;val+=q*m.preco/m.frasco}});
  h+='<div class="kpis"><div class="kpi"><small>Remédios com estoque</small><b>'+com+'</b></div><div class="kpi"><small>Abaixo do mínimo</small><b>'+lowN[r.id]+'</b></div><div class="kpi"><small>Valor em estoque</small><b>'+shortMoney(val)+'</b></div><div class="kpi"><small>Animais</small><b>'+num(r.cabecas||0)+'</b></div></div>';
  h+='<div class="chips" role="group" aria-label="Filtro">'+[['low','Abaixo do mínimo'],['all','Todos'],['zero','Zerados']].map(function(f){return '<button class="chip" data-act="rtF" data-v="'+f[0]+'" aria-pressed="'+(S.rtF===f[0])+'">'+f[1]+'</button>'}).join('')+'</div>';
  var rows=D.meds.map(function(m){return {m:m,q:qty(r.id,m.id)}}).filter(function(x){
    return S.rtF==='low'?x.q<(x.m.min||0):S.rtF==='zero'?x.q<=0:true;
  }).sort(function(a,b){return (a.q/((a.m.min)||1))-(b.q/((b.m.min)||1))||a.m.nome.localeCompare(b.m.nome)});
  if(!rows.length)h+='<div class="card empty">'+(S.rtF==='low'?'Este retiro não tem nada abaixo do mínimo.':'Nenhum item neste filtro.')+'</div>';
  h+='<div class="card stack">';
  rows.slice(0,S.rtN).forEach(function(x){
    var lw=x.q<(x.m.min||0),pct=Math.min(x.q/((x.m.min||1)*2),1)*100;
    h+='<div class="stack clk" style="gap:4px" data-act="ficha" data-v="'+esc(x.m.id)+'"><div class="row sb"><b>'+esc(x.m.nome)+'</b>'+(x.q<=0?'<span class="pill crit">Zerado</span>':lw?'<span class="pill warn">Baixo</span>':'<span class="pill ok">Em dia</span>')+'</div>'+
      '<div class="row sb small"><span><b>'+qs(x.q,x.m)+'</b> no retiro</span><span class="muted">mínimo '+qs(x.m.min||0,x.m)+(lw?' · faltam '+qs((x.m.min||0)-x.q,x.m):'')+'</span></div><div class="bar" aria-hidden="true"><i class="'+(lw?'low':'')+'" style="width:'+pct+'%"></i></div></div>';
  });
  if(rows.length>S.rtN)h+='<button class="btn" data-act="rtMore">Mostrar mais ('+(rows.length-S.rtN)+')</button>';
  return h+'</div>';
}

function cfUn(x){return x.un||'ml'}
function cfTot(c){var q=0,m=0,it=c.itens||[],by={ml:0,mg:0,un:0};it.forEach(function(i){q+=i.qtd||0;var tt=(i.qtd||0)*(i.ml||0);by[cfUn(i)]+=tt;if(cfUn(i)==='ml')m+=tt});return {n:it.length,q:q,ml:m,by:by}}
function cfTotTxt(t){var p=[];if(t.by.ml)p.push(num(Math.round(t.by.ml*10)/10)+' mL');if(t.by.mg)p.push(num(Math.round(t.by.mg*10)/10)+' mg');if(t.by.un)p.push(num(t.by.un)+' peças de material');return p.join(' · ')||'0'}
function cfLbl(x){var u=cfUn(x);return u==='mg'?'mg':u==='un'?'un':'mL'}
function cfLine(x){var u=cfUn(x);return u==='un'?num(x.qtd)+' un':num(x.qtd)+' un × '+num(x.ml)+' '+cfLbl(x)+' = '+num(Math.round((x.qtd||0)*(x.ml||0)*10)/10)+' '+cfLbl(x)}
function cfSorted(){return D.conferencias.slice().sort(function(a,b){return (b.ts||0)-(a.ts||0)})}
function cfSave(c,itens,extra){
  var data=JSON.parse(JSON.stringify(ext({itens:itens},extra||{})));
  DB.batch([{op:'set',col:'conferencias',id:c.id,data:data}]);
}
/* Descobre o volume do frasco a partir do texto "50 mL: 7898... / 250 mL: 7898..." do catálogo. */
function mlDoCodigo(apres,code){
  if(!apres||!code)return null;var m,re=/(\d+(?:[.,]\d+)?)\s*(mL|L)\b[^:;|\/]*:\s*(\d{13})/g;
  while((m=re.exec(apres))){if(m[3]===code){var n=parseFloat(m[1].replace(',','.'));return m[2]==='L'?n*1000:n}}
  return null;
}
function cfBuild(code,own,cat){
  var nome=own?own.nome:cat?cat.nome:'',lab=own?(own.lab||(cat&&cat.lab)||''):(cat?cat.lab:'');
  var mlv=mlDoCodigo(cat&&cat.apres,code)||(own&&own.frasco)||(cat&&cat.frasco)||'';
  return {nome:nome,lab:lab,barcode:code||'',un:(own&&own.unid)||'ml',ml:(own&&isMat(own))?1:mlv,qtd:1,medId:own?own.id:null,catId:cat?cat.id:null,fora:!own&&!cat,apres:(cat&&cat.apres)||''};
}
function cfRun(q){
  q=String(q||'').trim();S.cfQ=q;S.cfCur=null;S.cfRes=[];S.cfAsk=false;
  if(!q){render(true);return}
  if(isCode(q)){
    var own=ownByCode(q),cat=catFind(q)[0]||null;
    S.cfCur=cfBuild(q,own,cat);
  }else{
    var tk=norm(q).split(/\s+/).filter(Boolean),res=[];
    D.meds.forEach(function(m){var h=norm(m.nome+' '+(m.lab||''));if(tk.every(function(t){return h.indexOf(t)>-1}))res.push({src:'fazenda',nome:m.nome,lab:m.lab||'',own:m,cat:null})});
    catFind(q).slice(0,12).forEach(function(c){
      if(res.some(function(r){return norm(r.nome)===norm(c.nome)&&norm(r.lab)===norm(c.lab)}))return;
      res.push({src:'catalogo',nome:c.nome,lab:c.lab,own:null,cat:c});
    });
    S.cfRes=res.slice(0,10);
    if(!res.length)S.cfCur={nome:q,lab:'',barcode:'',un:'ml',ml:'',qtd:1,medId:null,catId:null,fora:true,apres:''};
  }
  render(true);
  setTimeout(function(){var e=$('#cf-qtd');if(e){e.focus();e.select()}},80);
}
function cfPick(i){
  var r=S.cfRes[i];if(!r)return;
  var cb=(r.cat&&(r.cat.barcodes||[])[0])||(r.own&&r.own.barcode)||'';
  var cur=cfBuild(cb,r.own,r.cat);cur.barcode=cb;
  if(!r.cat&&r.own)cur.barcode=r.own.barcode||'';
  S.cfCur=cur;S.cfRes=[];render(true);
  setTimeout(function(){var e=$('#cf-qtd');if(e){e.focus();e.select()}},80);
}
function cfAdd(){
  var c=byId(D.conferencias,S.cfId);if(!c||c.status!=='aberta'||!S.cfCur)return;
  var g=function(id){return (($('#'+id)||{}).value||'')};
  var nome=g('cf-nome').trim(),lab=g('cf-lab').trim(),qtd=Math.round(parseNum(g('cf-qtd'))),mlv=parseNum(g('cf-ml')),un=g('cf-un')||'ml';
  if(un==='un')mlv=1;
  if(!nome){toast('Informe o nome do produto');return}
  if(!(qtd>0)){toast('Informe quantas unidades');return}
  if(!(mlv>0)){toast('Informe o conteúdo de cada unidade ('+(un==='mg'?'mg':'mL')+')');return}
  var cur=S.cfCur,it=(c.itens||[]).slice(),hit=-1;
  it.forEach(function(x,i){if(hit<0&&x.ml===mlv&&cfUn(x)===un&&((cur.barcode&&x.barcode===cur.barcode)||(!cur.barcode&&norm(x.nome)===norm(nome)&&norm(x.lab)===norm(lab))))hit=i});
  if(hit>-1){it[hit]=ext(it[hit],{qtd:(it[hit].qtd||0)+qtd})}
  else it.push({id:'I'+uid8(),nome:nome,lab:lab,barcode:cur.barcode||'',qtd:qtd,ml:mlv,un:un,fora:!!cur.fora,medId:cur.medId||null,catId:cur.catId||null,ts:Date.now()});
  cfSave(c,it,{atualizadoEm:Date.now()});
  S.cfCur=null;S.cfQ='';S.cfRes=[];
  toast(hit>-1?'Somado ao que já estava na lista':'Adicionado à conferência');
  render(true);setTimeout(function(){var e=$('#cf-q');if(e)e.focus()},80);
}

  var ops=[{op:'set',col:'approvals',id:a.id,data:{st:ok?'ok':'no',resolvidoEm:Date.now(),resolvidoPor:S.profile.nome}}],p=a.payload||{};

      if(ok){ops.push({op:'set',col:'launches',id:l.id,data:{st:'cancelado'}});ops.push({op:'inc',col:'stock',id:l.retiro+'__'+l.med,data:{loc:l.retiro,med:l.med},n:l.qtd})}

      lg('cadastro','fazenda_liberada','Liberou a fazenda '+uf.fazendaNome+' para o gerente '+uf.nome,null,{},nfid)]);
    toast('Fazenda liberada');
  }
  else if(a==='fzNo'){var ur=byId(D.users,v);if(ur){DB.batch([{op:'set',col:'users',id:v,data:{status:'recusado'}}]);toast('Pedido recusado')}}
  else if(a==='fzBlock'||a==='fzUnblock'){
    var fz=byId(D.fazendas,v);if(!fz)return;var fb=a==='fzBlock';
    DB.batch([{op:'set',col:'fazendas',id:v,data:{status:fb?'bloqueada':'ativa'}},lg('cadastro',fb?'fazenda_bloqueada':'fazenda_reativada',(fb?'Bloqueou':'Reativou')+' a fazenda '+fz.nome,null,{},v)]);
    toast(fb?'Fazenda bloqueada':'Fazenda reativada');
  }
  else if(a==='fzOpen'){S.fid=v;S.view='ger';S.gtab='painel';S.tab='home';S.asRetiro=null;startSubs()}
  else if(a==='fzDemo'){
    if(S.busy)return;
    if(D.catalogo.filter(function(c){return c.unidade!=='outro'}).length<20){toast('Importe o catálogo primeiro (aba Catálogo).');return}
    if(S.demoAsk!==v){S.demoAsk=v;toast('Toque de novo para confirmar');render(true);return}
    S.demoAsk=null;
    var dfz=byId(D.fazendas,v);if(!dfz)return;
    var dops=(dfz.demo?demoDelOps(v):[]).concat(seedBig(v));
    dops.push(lg('cadastro','dados_demonstracao','Gerou os dados de demonstração na fazenda '+dfz.nome+' (200 medicamentos, 5 retiros, aplicações, envios, aprovações e compras)',null,{},v));
    toast('Gerando os dados de demonstração...');
    runChunks(dops,function(){toast('Dados de demonstração criados. Abra a fazenda para ver.')});return;
  }
  else if(a==='fzDemoDel'){
    if(S.busy)return;
    var rops=demoDelOps(v);if(!rops){toast('Esta fazenda não tem dados de demonstração');return}
    var rfz=byId(D.fazendas,v);
    rops.push(lg('cadastro','dados_demonstracao_removidos','Removeu os dados de demonstração da fazenda '+(rfz?rfz.nome:''),null,{},v));
    runChunks(rops,function(){toast('Dados de demonstração removidos')});return;
  }
  else if(a==='fzTest'){
    var tf='f'+uid8(),tnome='Fazenda Teste '+dstr(Date.now());
    var tops=[{op:'set',col:'fazendas',id:tf,data:{nome:tnome,status:'ativa',criadoEm:Date.now(),gerenteUid:null,teste:true}}].concat(seedOps(tf,DEMO));
    tops.push(lg('cadastro','fazenda_teste','Criou a fazenda de teste '+tnome,null,{},tf));
    DB.batch(tops);toast('Fazenda de teste criada');
  }
  render(true);
});
document.addEventListener('submit',function(ev){if(ev.target.id==='lform'){ev.preventDefault();doLogin()}});
document.addEventListener('input',function(ev){
  var t=ev.target,w=S.wiz;
  if(t.id==='brinco'&&w){w.brinco=t.value.replace(/\D/g,'').slice(0,15);render()}
  else if(t.id==='lnome'&&w){w.loteNome=t.value;render()}
  else if(t.id==='wpesoin'&&w){var pv=parseInt(t.value.replace(/\D/g,''),10)||0;w.peso=Math.max(0,Math.min(1500,pv));w.dose=calc().sug;render()}
  else if(t.id==='busca'&&w){w.q=t.value;render()}
  else if(t.id==='gs-q'){S.gq=t.value;render(true)}
  else if(t.id==='g-q'||t.id==='rt-q'){
    var tg=(t.id==='g-q')?S.env:S.ret;tg.q=t.value;var ml0=medMatch(t.value);
    if(ml0.length){var pick=ml0.filter(function(x){return qty('central',x.id)>0})[0]||ml0[0];
      if(ml0.indexOf(medById(tg.med))<0||qty('central',tg.med)<=0&&qty('central',pick.id)>0){tg.med=pick.id;if(t.id==='g-q')tg.frascos=1}}
    render(true);return}
  else if(t.id==='perda-q'){S.perdaQ=t.value}
  else if(t.id==='c-nf'){S.compra.nf=t.value}
  else if(t.id==='rt-qtd'){S.ret.qtd=t.value;var rb=$('[data-act=retirada]');if(rb){var rm2=medById(S.ret.med),q2=parseNum(t.value)||0,b2=isMat(rm2)?q2:q2*rm2.frasco;rb.disabled=!(q2>0&&b2<=qty('central',S.ret.med))}render(true)}
  else if(t.id==='rt-outro'){S.ret.outro=t.value}
  else if(t.id==='rt-por'){S.ret.por=t.value}
  else if(t.id==='rt-obs'){S.ret.obs=t.value}
});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Enter')return;
  var t=ev.target;
  if(t.id==='mq'){ev.preventDefault();mqRun(t.value)}
  else if(t.id==='cf-q'){ev.preventDefault();cfRun(t.value)}
  else if(t.id==='cf-qtd'||t.id==='cf-ml'){ev.preventDefault();if(t.id==='cf-qtd'){var ml2=$('#cf-ml');if(ml2&&!ml2.value){ml2.focus()}else cfAdd()}else cfAdd()}
  else if(t.id==='cat-q2'){ev.preventDefault();S.catQ=t.value.trim();S.catN=40;render(true)}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='cf-un'&&S.cfCur){var gv=function(id){return (($('#'+id)||{}).value||'')};S.cfCur.nome=gv('cf-nome');S.cfCur.lab=gv('cf-lab');S.cfCur.qtd=gv('cf-qtd')||1;S.cfCur.ml=gv('cf-ml')||S.cfCur.ml;S.cfCur.un=t.value;if(t.value==='un')S.cfCur.ml=1;else if(S.cfCur.ml===1)S.cfCur.ml='';render(true);return}
  if(t.getAttribute&&t.getAttribute('data-cfi')){
    var cc2=byId(D.conferencias,S.cfId);
    if(cc2&&cc2.status==='aberta'){
      var fld=t.getAttribute('data-cff'),val=parseNum(t.value);
      if(!(val>0)){toast('Informe um número maior que zero');render(true);return}
      cfSave(cc2,(cc2.itens||[]).map(function(x){if(x.id!==t.getAttribute('data-cfi'))return x;var o=ext({},x);o[fld]=fld==='qtd'?Math.round(val):val;return o}),{atualizadoEm:Date.now()});
    }
  }
  else if(t.id==='cat-lab'){S.catLab=t.value;S.catN=40}
  else if(t.id==='cat-st'){S.catSt=t.value;S.catN=40}
  else
  if(t.id==='rt-med'){S.ret.med=t.value}
  else if(t.id==='rt-dest'){S.ret.dest=t.value}
  else if(t.id==='g-dest'){S.env.dest=t.value}
  else if(t.id==='g-med'){S.env.med=t.value;S.env.frascos=1}
  else if(t.id==='c-med'){S.compra.med=t.value;S.compra.frascos=1}
  else if(t.id==='as-ret'){S.asRetiro=t.value;S.wiz=null}
  else if(t.id==='h-ret'){S.histRet=t.value;S.histN=100}
  else return;
  render(true);
});
window.addEventListener('online',function(){render(true)});
window.addEventListener('offline',function(){render(true)});

/* ================= início ================= */
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
if(DEMO){if(DB.isEmpty())seedDemo()}
else{bootFirebase()}
draw();
})();
</script>

  setTimeout(function(){el.classList.add('out');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},400)},3000);
