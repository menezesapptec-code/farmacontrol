<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Farma Control</title>
<meta name="theme-color" content="#12382A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312382A'/%3E%3Cpath d='M32 14v36M14 32h36' stroke='%23F4C20D' stroke-width='10' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --outer:#D3DCD2; --bg:#E9EEE8; --surface:#FFFFFF; --surface2:#F1F5F0;
  --ink:#14201A; --muted:#556459; --line:#D1DAD0;
  --hdr:#12382A; --hdr-ink:#F2F7F3; --brand:#1B6B47;
  --cta:#F4C20D; --cta-ink:#1A1600;
  --ok:#1E7A4A; --ok-bg:#DDF1E4;
  --warn:#A94C08; --warn-bg:#FCE9D6;
  --crit:#B3261E; --crit-bg:#FADAD7;
  --info:#1B5E9B; --info-bg:#DCEAF7;
  --strip:#0B100D; --strip-ink:#CDD7CF; --seg-bg:#1C261F; --seg-on:#EEF4EF; --seg-on-ink:#12382A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --outer:#070B09; --bg:#0E1511; --surface:#17211B; --surface2:#1E2A23;
    --ink:#E6EEE8; --muted:#9BAEA1; --line:#2B3A31;
    --hdr:#0A2018; --hdr-ink:#EAF3EC; --brand:#7ED3A2;
    --ok:#6FD39A; --ok-bg:#16372A; --warn:#F0A25C; --warn-bg:#3C2812;
    --crit:#F2918A; --crit-bg:#431B18; --info:#8DBBEA; --info-bg:#172B40;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--outer);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.px{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.device{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:640px){
  body{padding-block:12px}
  .device{border-radius:26px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.2)}
  body.dsk{padding-block:0}
}
/* Painéis de gerência e administrador: tela cheia de notebook. O app do responsável continua em coluna de celular. */
.device.desktop{max-width:none;margin:0;border:0;border-radius:0;box-shadow:none}
.app{flex:1;min-height:0;display:flex;flex-direction:column}
.strip{background:var(--strip);color:var(--strip-ink);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;padding-block:7px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.seg{display:inline-flex;background:var(--seg-bg);border-radius:99px;padding:2px;align-items:center}
.seg button,.seg select{border:0;background:transparent;color:var(--strip-ink);font-size:12px;letter-spacing:0;text-transform:none;padding:4px 11px;border-radius:99px;min-height:28px}
.seg select{background:var(--seg-bg)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--seg-on-ink);font-weight:600}
.strip-ctl{display:flex;gap:8px;flex-wrap:wrap}
.hdr{background:var(--hdr);color:var(--hdr-ink);padding-block:12px 14px}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.hdr-sub{font-size:13px;opacity:.82;margin-top:3px}
.hdr .back{background:transparent;border:0;color:var(--hdr-ink);display:flex;align-items:center;gap:6px;min-height:44px;min-width:44px;margin-left:-8px;padding:0 8px;font-weight:600}
.modal{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.hdr .out svg{vertical-align:-3px}
.hdr .out{background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--hdr-ink);border-radius:99px;min-height:32px;padding:0 12px;font-size:13px}
.hdr .chips{margin-top:10px}
.hdr .chip{min-height:32px;font-size:13px;padding:0 12px;background:transparent;border-color:rgba(255,255,255,.35);color:var(--hdr-ink)}
.hdr .chip[aria-pressed="true"]{background:var(--cta);color:var(--cta-ink);border-color:transparent}
.hr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}
.steps i{height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
.steps i.on{background:var(--cta)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.info{background:var(--info-bg);color:var(--info)}
.view{flex:1;min-height:0;overflow-y:auto;padding-block:16px 24px;display:flex;flex-direction:column;gap:14px}
.h1{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
.h2{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:17px;padding:10px 16px;text-align:center}
.btn.cta{background:var(--cta);color:var(--cta-ink);border-color:transparent}
.btn.dark{background:var(--hdr);color:var(--hdr-ink);border-color:transparent}
.btn.danger{color:var(--crit)}
.btn.sm{min-height:44px;font-size:15px;width:auto;padding:8px 14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{min-height:84px;font-size:22px;font-family:var(--font-display);letter-spacing:.04em;text-transform:uppercase;flex-direction:column;gap:2px}
.btn.big small{font-family:var(--font-body);font-size:13px;letter-spacing:0;text-transform:none;font-weight:500;opacity:.85}
.badge{background:var(--crit);color:#fff;border-radius:99px;font-size:12px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn{flex-direction:column;min-height:88px;font-size:15px;gap:6px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:96px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);width:100%}
.tile b{font-family:var(--font-display);font-size:24px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.tile[aria-pressed="true"]{border-color:var(--brand);background:var(--surface2)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.opt:disabled{opacity:.5}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.input{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 14px;font-size:20px;width:100%;font-variant-numeric:tabular-nums}
.input.t{font-size:17px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px;font-weight:500}
.chk input{width:22px;height:22px;flex:none}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;align-items:stretch;gap:8px}
.stepper button{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:30px;font-weight:600}
.stepper output{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-family:var(--font-display);font-size:40px;font-weight:700;line-height:1}
.stepper output small{font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--muted)}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:0}
.sumrow span:first-child{color:var(--muted)}
.sumrow span:last-child{text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere}
.note{border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.crit{background:var(--crit-bg);color:var(--crit)}
.note.info{background:var(--info-bg);color:var(--info)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note svg{flex:none;margin-top:1px}
.foot{border-top:1px solid var(--line);background:var(--surface);padding-block:12px}
.bar{height:9px;background:var(--surface2);border-radius:5px;position:relative;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ok)}
.bar i.low{background:var(--warn)}
.nav{background:var(--surface);border-top:1px solid var(--line);display:grid;gap:4px;padding-block:8px}
.nav.n1{grid-template-columns:1fr}
.nav.n4{grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:12px;font-size:11px;font-weight:600;color:var(--muted);position:relative;min-width:0}
.nav.n4 button{font-size:12px}
.nav button[aria-current="page"]{color:var(--brand)}
.nav button.cta{background:var(--cta);color:var(--cta-ink)}
.nav .badge{position:absolute;top:2px;right:calc(50% - 24px)}
.toast{position:absolute;left:16px;right:16px;bottom:92px;background:var(--hdr);color:var(--hdr-ink);padding:12px 14px;border-radius:12px;font-size:14px;font-weight:500;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.login{flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:24px;background:var(--hdr);color:var(--hdr-ink)}
.login .input{background:#fff;color:#14201A;border-color:transparent}
.login .field label{color:var(--hdr-ink);opacity:.85}
.login .lnk{background:transparent;border:0;color:var(--hdr-ink);text-decoration:underline;min-height:44px;font-size:14px}
.login .err{background:var(--crit-bg);color:var(--crit);border-radius:12px;padding:10px 12px;font-size:14px}
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center}
.btrack{position:relative;height:26px;background:var(--surface2);border-radius:6px;border:1px solid var(--line)}
.btrack i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--brand);opacity:.55}
.btrack i.hi{opacity:1;background:var(--warn)}
.btrack span{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.axis{display:grid;grid-template-columns:62px 1fr;gap:10px;font-size:11px;color:var(--muted)}
.axis div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-family:var(--font-display);font-size:26px;line-height:1.1;font-weight:700;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--hdr);color:var(--hdr-ink);border-color:var(--hdr)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.success{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-top:10px}
.success .tick{width:84px;height:84px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion: no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}}
.splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease}
.splash img{width:min(78vmin,520px);height:auto;display:block}
.splash.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion: reduce){.splash{transition:none}}
.login>*{width:100%;max-width:420px;align-self:center}
.shell{flex:1;min-height:0;display:flex;flex-direction:row}
.side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:16px 12px;overflow-y:auto}
.side button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:16px;font-weight:600;text-align:left;position:relative}
.side button:hover{background:var(--surface2)}
.side button[aria-current="page"]{background:var(--surface2);color:var(--brand)}
.side button .badge{margin-left:auto}
.view.desk{align-content:start;grid-auto-rows:max-content;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-content:start;align-items:start;padding-block:24px 40px;padding-inline:max(24px,calc((100% - 1320px)/2))}
.desk>.h1,.desk>.h2,.desk>.kpis,.desk>.note,.desk>.chips,.desk>.small,.desk>.filters,.desk>.card.full,.desk>.card.empty{grid-column:1/-1}
.desk>.btn{grid-column:1/-1;width:auto;justify-self:start;min-width:240px}
.desk>.h1{font-size:34px}
.desk .span2{grid-column:span 2}
.desktop .hdr.px{padding-left:24px;padding-right:24px}
.desktop .strip.px{padding-left:24px;padding-right:24px}
.desktop .kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.desktop .kpi b{font-size:34px}
.desktop .brow{grid-template-columns:120px 1fr}
.desktop .axis{grid-template-columns:120px 1fr}
.chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.filters .field{min-width:220px}
.card.tbl{padding:0;overflow-x:auto}
.tbl table{width:100%;min-width:760px;border-collapse:collapse;font-size:15px}
.tbl th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 14px;white-space:nowrap}
.tbl td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
.tbl td.dt{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:860px){
  .shell{flex-direction:column-reverse}
  .side{width:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:8px 8px;gap:4px;overflow-x:auto;overflow-y:hidden}
  .side button{flex:1;min-width:64px;flex-direction:column;justify-content:center;gap:2px;min-height:56px;padding:0 6px;font-size:11px;text-align:center}
  .side button .badge{position:absolute;top:2px;right:calc(50% - 24px);margin-left:0}
  .desktop .kpis{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){.desk .span2{grid-column:auto}}
</style>
</head>

      },function(err){console.error(col,err);onSubError(col,err)});
    },
    subDoc:function(col,id,cb,errcb){
      if(DEMO){return this.sub(col,function(docs){cb(byId(docs,id),false)})}
      return fs.collection(path(col)).doc(id).onSnapshot({includeMetadataChanges:true},function(snap){
        cb(snap.exists?ext({id:id},snap.data()):null,snap.metadata.fromCache);
      },function(err){console.error(col,err);if(errcb)errcb(err)});
    },
    setSimOff:function(off){
      simOff=off;
      if(!off){for(var c in L){for(var id in L[c]){delete L[c][id]._pend}}lsSave();Object.keys(L).forEach(emit)}
    },
    batch:function(ops){
      if(DEMO){
        var touched={};
        ops.forEach(function(o){
          var p=path(o.col,o.fid),c=L[p]||(L[p]={});
          if(o.op==='set'){c[o.id]=ext(c[o.id]||{},o.data)}
          else if(o.op==='log'){c[o.id]=ext(ext({},o.data),{em:Date.now()})}
          else if(o.op==='inc'){var d=c[o.id]||(c[o.id]=ext({qtd:0},o.data));d.qtd=(d.qtd||0)+o.n}
          else if(o.op==='del'){delete c[o.id]}
          if(simOff&&c[o.id])c[o.id]._pend=true;
          touched[p]=1;
        });
        lsSave();Object.keys(touched).forEach(emit);
        return Promise.resolve();
      }
      var b=fs.batch();
      ops.forEach(function(o){
        var ref=fs.collection(path(o.col,o.fid)).doc(o.id);
        if(o.op==='set')b.set(ref,o.data,{merge:true});
        else if(o.op==='log')b.set(ref,ext(ext({},o.data),{em:firebase.firestore.FieldValue.serverTimestamp()}));
        else if(o.op==='inc')b.set(ref,ext(ext({},o.data),{qtd:firebase.firestore.FieldValue.increment(o.n)}),{merge:true});
        else if(o.op==='del')b['delete'](ref);
      });
      return b.commit().catch(function(e){console.error(e);toast('Erro ao salvar: '+(e.code||e.message))});
    }
  };
})();

var AUTH_MSG={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.',
  'auth/email-already-in-use':'Este e-mail já tem cadastro.','auth/weak-password':'A senha precisa ter 6 ou mais caracteres.','auth/invalid-email':'E-mail inválido.',
  'auth/network-request-failed':'Sem internet para entrar.','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.','auth/operation-not-allowed':'Ative o login por e-mail e senha no Firebase (Authentication).'};
function authErr(e){return AUTH_MSG[e&&e.code]||('Erro: '+((e&&e.code)||(e&&e.message)||'tente de novo'))}
function subKeyOf(p){return [p.role,p.status,p.fazendaId,(p.retiros||[]).join(',')].join('|')}
function bootFirebase(){
  if(DEMO||NOFB)return;
  firebase.auth().onAuthStateChanged(function(u){
    S.authReady=true;
    if(profUnsub){profUnsub();profUnsub=null}
    if(!u){stopSubs();S.profile=null;S.subKey='';render(true);return}
    var ref=firebase.firestore().collection('users').doc(u.uid);
    profUnsub=ref.onSnapshot(function(snap){
      if(!snap.exists){
        if(snap.metadata.fromCache)return;
        var email=(u.email||'').toLowerCase(),adm=ADMIN_EMAILS.indexOf(email)>-1,nome=S.signupName||u.displayName||email;
        if(adm){ref.set({nome:nome,email:email,role:'superadmin',status:'ativo',fazendaId:null,retiros:[],criadoEm:Date.now()}).catch(function(e){S.err='Não foi possível criar o cadastro: '+(e.code||e.message);render(true)})}
        else if(S.signupFazenda){ref.set({nome:nome,email:email,role:'gerente',status:'pendente',fazendaId:null,fazendaNome:S.signupFazenda,retiros:[],criadoEm:Date.now()}).catch(function(e){S.err='Não foi possível criar o cadastro: '+(e.code||e.message);render(true)})}
        else{S.err='Cadastro não encontrado. Peça ao gerente da sua fazenda para cadastrar você.';firebase.auth().signOut()}
        return;
      }
      S.profile=ext({id:u.uid},snap.data());
      var key=subKeyOf(S.profile);
      if(key!==S.subKey){
        S.subKey=key;
        S.view=homeView();S.fid=null;S.tab='home';S.gtab=isAlmox()?'central':'painel';
        if(S.profile.status==='ativo')startSubs();else stopSubs();
      }
      render(true);
    },function(e){console.error(e);S.err='Sem permissão para ler seu cadastro. Confira as regras do Firestore.';render(true)});
  });
}
function doLogin(){
  var g=function(id){return (($('#'+id)||{}).value||'').trim()};
  var email=g('l-email'),pw=($('#l-senha')||{}).value||'',nome=g('l-nome'),faz=g('l-faz');
  S.err='';
  if(!email||!pw){S.err='Preencha e-mail e senha.';render(true);return}
  if(S.loginSignup&&(!nome||!faz)){S.err='Informe seu nome e o nome da fazenda.';render(true);return}
  S.busy=true;render(true);
  var p;
  if(S.loginSignup){S.signupName=nome;S.signupFazenda=faz;p=firebase.auth().createUserWithEmailAndPassword(email,pw)}
  else p=firebase.auth().signInWithEmailAndPassword(email,pw);
  p.then(function(){S.busy=false}).catch(function(e){S.busy=false;S.err=authErr(e);render(true)});
}
function doReset(){
  var email=(($('#l-email')||{}).value||'').trim();
  if(!email){S.err='Digite seu e-mail para receber o link.';render(true);return}
  firebase.auth().sendPasswordResetEmail(email).then(function(){toast('Link enviado para '+email)}).catch(function(e){S.err=authErr(e);render(true)});
}

function stats(){
  var since=Date.now()-30*DAY,cons={},heads=0,valor=0,perdas=0,alerts=[],exp=[];
  retiros().forEach(function(r){cons[r.id]=0;heads+=r.cabecas||0});
  D.launches.forEach(function(l){if(l.st!=='cancelado'&&l.ts>=since&&cons[l.retiro]!=null)cons[l.retiro]+=l.custo||0});
  D.stock.forEach(function(s){var m=medById(s.med);if(m)valor+=(s.qtd||0)*m.preco/m.frasco});
  D.approvals.forEach(function(a){if(a.tipo==='Perda'&&a.st==='ok'&&a.ts>=since)perdas+=(a.payload&&a.payload.valor)||0});
  retiros().forEach(function(r){D.meds.forEach(function(m){var q=qty(r.id,m.id);if(q<m.min)alerts.push({r:r,m:m,q:q})})});
  D.meds.forEach(function(m){var d=daysTo(m.venc);if(d<=30){var tot=0;D.stock.forEach(function(s){if(s.med===m.id)tot+=s.qtd||0});if(tot>0)exp.push({m:m,d:d})}});
  return {cons:cons,heads:heads,valor:valor,perdas:perdas,alerts:alerts,exp:exp};
}

function resolveApproval(a,ok){
  var ops=[{op:'set',col:'approvals',id:a.id,data:{st:ok?'ok':'no',resolvidoEm:Date.now(),resolvidoPor:S.profile.nome}}],p=a.payload||{};
  if(a.tipo==='Perda'&&ok&&p.qtd>0)ops.push({op:'inc',col:'stock',id:p.loc+'__'+p.med,data:{loc:p.loc,med:p.med},n:-p.qtd});
  if(a.tipo==='Correção'){
    var l=byId(D.launches,p.launchId);
    if(l){
      if(ok){ops.push({op:'set',col:'launches',id:l.id,data:{st:'cancelado'}});ops.push({op:'inc',col:'stock',id:l.retiro+'__'+l.med,data:{loc:l.retiro,med:l.med},n:l.qtd})}
      else ops.push({op:'set',col:'launches',id:l.id,data:{st:'ok'}});
    }
  }
  ops.push(lg('aprovacao','aprovacao_'+(ok?'ok':'no'),(ok?'Aprovou':'Rejeitou')+' ('+a.tipo+'): '+a.txt,a.retiro,{approvalId:a.id}));
  DB.batch(ops);
}
function sendTransfer(){
  var e=S.env,m=medById(e.med),q=e.frascos*m.frasco;
  if(q>qty('central',e.med))return;
  var id='TR-'+(Date.now()%1000000),ops=[
    {op:'set',col:'transfers',id:id,data:{dest:e.dest,ts:Date.now(),itens:[{med:e.med,ml:q}],st:'transito',por:S.profile.nome}},
    {op:'inc',col:'stock',id:'central__'+e.med,data:{loc:'central',med:e.med},n:-q},
    lg('estoque','transferencia_envio','Enviou '+id+' para '+retiroNome(e.dest)+': '+m.nome+' '+ml(q),e.dest,{transferId:id,med:e.med,ml:q})];
  D.approvals.forEach(function(a){if(a.tipo==='Reposição'&&a.st==='pend'&&a.retiro===e.dest&&a.payload&&a.payload.med===e.med)ops.push({op:'set',col:'approvals',id:a.id,data:{st:'ok',resolvidoEm:Date.now(),resolvidoPor:S.profile.nome}})});
  DB.batch(ops);
  toast('Enviado para '+retiroNome(e.dest)+'. Já aparece na tela do responsável.');
}
function createResponsavel(nome,email,senha,rets,role){
  role=role||'vaqueiro';
  S.busy=true;render(true);
  var fid=fidNow();
  function gravar(uid){
    DB.batch([{op:'set',col:'users',id:uid,data:{nome:nome,email:email.toLowerCase(),role:role,status:'ativo',fazendaId:fid,retiros:rets,criadoPor:S.profile.id,criadoEm:Date.now()}},
      lg('equipe','usuario_criado',role==='almoxarife'?'Cadastrou o almoxarife '+nome+' ('+email+')':'Cadastrou o responsável '+nome+' ('+email+') nos retiros: '+rets.map(retiroNome).join(', '),null,{uid:uid,retiros:rets,role:role})]);
    S.busy=false;toast(role==='almoxarife'?'Almoxarife cadastrado':'Responsável cadastrado');render(true);
  }
  if(DEMO){gravar('u-'+uid8());return}
  var sec=null;firebase.apps.forEach(function(a){if(a.name==='sec')sec=a});
  if(!sec)sec=firebase.initializeApp(firebaseConfig,'sec');
  sec.auth().createUserWithEmailAndPassword(email,senha).then(function(cred){
    var uid=cred.user.uid;
    return sec.auth().signOut().then(function(){gravar(uid)});
  }).catch(function(e){S.busy=false;toast(authErr(e));render(true)});
}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.getAttribute('data-act'),v=b.getAttribute('data-v'),w=S.wiz,ret=(S.profile&&S.profile.status==='ativo'&&S.view!=='sa')?ctxRet():null;

  else if(a==='sa'){S.view='sa';S.fid=null;S.wiz=null;startSubs()}
  else if(a==='net'){var was=S.online;S.online=(v==='on');DB.setSimOff(!S.online);if(!was&&S.online)toast('Sinal voltou. Fila enviada.');else if(was&&!S.online)toast('Sem sinal. Lançamentos ficam salvos no celular.')}
  else if(a==='dlogin'){demoLogin(v);return}
  else if(a==='dreset'){DB.reset();seedDemo();toast('Dados de teste recarregados')}
  else if(a==='toggleSignup'){S.loginSignup=!S.loginSignup;S.err=''}
  else if(a==='reset'){doReset();return}
  else if(a==='install'){
    if(instEv){var ev=instEv;instEv=null;ev.prompt();ev.userChoice.then(function(){draw()}).catch(function(){});return}
    instHelp();return}
  else if(a==='closeModal'){var m=document.querySelector('.modal');if(m)m.parentNode.removeChild(m);return}
  else if(a==='logout'){logout();return}
  else if(a==='selRet'){S.retiroSel=v;S.wiz=null;S.tab='home'}
  else if(a==='nav'){if(v==='lancar')wizStart();else S.tab=v}
  else if(a==='repor'){S.tab='estoque';S.filtro='repor'}
  else if(a==='repor1'){
    if(reposPend(ret,v))return;
    var mm=medById(v),txt=retiroNome(ret)+' pediu reposição de '+mm.nome+' (tem '+ml(qty(ret,v))+', mínimo '+ml(mm.min)+')';
    DB.batch([{op:'set',col:'approvals',id:'AP'+uid8(),data:{ts:Date.now(),tipo:'Reposição',retiro:ret,st:'pend',por:S.profile.nome+' · '+retiroNome(ret),txt:txt,payload:{med:v,retiro:ret}}},
      lg('estoque','reposicao_pedido','Pediu reposição de '+mm.nome+' para '+retiroNome(ret),ret,{med:v})]);
    toast('Pedido enviado à farmácia central');
  }
  else if(a==='filtro'){S.filtro=v}
  else if(a==='perda'){S.perdaOpen=(S.perdaOpen===v?null:v);S.perdaQ=''}
  else if(a==='perdaMot'){S.perdaMotivo=v}
  else if(a==='perdaSend'){
    var q=parseNum(S.perdaQ),pm=medById(v);
    if(q<=0){toast('Digite a quantidade perdida');return}
    if(q>qty(ret,v)){toast('Mais do que tem no estoque');return}
    var ptxt=retiroNome(ret)+' · perda de '+ml(q)+' de '+pm.nome+' ('+S.perdaMotivo+', '+brl(q*pm.preco/pm.frasco)+')';
    DB.batch([{op:'set',col:'approvals',id:'AP'+uid8(),data:{ts:Date.now(),tipo:'Perda',retiro:ret,st:'pend',por:S.profile.nome+' · '+retiroNome(ret),txt:ptxt,payload:{med:v,loc:ret,qtd:q,valor:q*pm.preco/pm.frasco,motivo:S.perdaMotivo}}},
      lg('estoque','perda_pedido','Pediu aprovação de perda: '+ptxt,ret,{med:v,qtd:q})]);
    S.perdaOpen=null;S.perdaQ='';toast('Perda enviada para aprovação');
  }
  else if(a==='corr'){S.corrOpen=(S.corrOpen===v?null:v)}
  else if(a==='corrWhy'){
    var p=v.split('|'),l=byId(D.launches,p[0]);if(!l)return;
    var ctxt=retiroNome(l.retiro)+' pediu correção do lançamento de '+l.medNome+' ('+ml(l.qtd)+', '+l.alvo+'). Motivo: '+p[1];

      lg('aplicacao','correcao_pedido','Pediu correção: '+ctxt,l.retiro,{launchId:l.id})]);
    S.corrOpen=null;toast('Correção enviada para aprovação');
  }
  else if(a==='rcv'){
    var t=byId(D.transfers,v);if(!t)return;
    var ops=[],dif=[],got=[];
    t.itens.forEach(function(it){
      var inp=document.getElementById('r-'+t.id+'-'+it.med),gt=Math.max(0,parseNum(inp?inp.value:it.ml));
      got.push({med:it.med,ml:gt});
      ops.push({op:'inc',col:'stock',id:t.dest+'__'+it.med,data:{loc:t.dest,med:it.med},n:gt});
      if(gt!==it.ml){var x=medById(it.med);dif.push((x?x.nome:it.med)+': enviado '+ml(it.ml)+', recebido '+ml(gt))}
    });
    ops.push({op:'set',col:'transfers',id:t.id,data:{st:'recebida',recebido:got,recebidoEm:Date.now(),recebidoPor:S.profile.nome}});
    ops.push(lg('estoque','transferencia_recebimento','Confirmou o recebimento de '+t.id+' em '+retiroNome(t.dest)+(dif.length?' com diferença: '+dif.join('; '):''),t.dest,{transferId:t.id,recebido:got}));
    if(dif.length)ops.push({op:'set',col:'approvals',id:'AP'+uid8(),data:{ts:Date.now(),tipo:'Divergência',retiro:t.dest,st:'pend',por:S.profile.nome+' · '+retiroNome(t.dest),txt:retiroNome(t.dest)+' recebeu '+t.id+' com diferença. '+dif.join('; '),payload:{}}});
    DB.batch(ops);
    toast(dif.length?'Recebido. A diferença foi para a gerência.':'Recebimento confirmado. Estoque atualizado.');
    S.tab='home';
  }
  else if(a==='wback'){if(w.step===0||w.step===5)S.wiz=null;else w.step--}
  else if(a==='wtipo'){w.tipo=v;w.step=1;w.all=false;w.q=''}
  else if(a==='wmodo'){w.modo=v}
  else if(a==='wpeso'){w.peso=Math.max(40,Math.min(900,w.peso+parseInt(v,10)))}
  else if(a==='wlote'){var lt=byId((D.config&&D.config.lotes)||[],v);if(lt){w.loteNome=lt.nome;w.n=lt.n;w.peso=lt.peso}}
  else if(a==='wn'){w.n=Math.max(1,w.n+parseInt(v,10))}
  else if(a==='wmed'){w.med=v;w.step=3;w.dose=calc().sug}
  else if(a==='wall'){w.all=!w.all}
  else if(a==='wnext'){w.step++}
  else if(a==='dose'){var stp=w.dose>=100?5:1;w.dose=Math.max(1,w.dose+parseInt(v,10)*stp)}
  else if(a==='save'){saveLaunch(ret)}
  else if(a==='wnew'){wizStart()}
  else if(a==='whome'){S.wiz=null;S.tab='home'}
  else if(a==='gnav'){S.gtab=v}
  else if(a==='gfr'){S.env.frascos=Math.max(1,S.env.frascos+parseInt(v,10))}
  else if(a==='cfr'){S.compra.frascos=Math.max(1,S.compra.frascos+parseInt(v,10))}
  else if(a==='send'){sendTransfer()}
  else if(a==='compra'){
    var cp=S.compra,mc=medById(cp.med),qc=cp.frascos*mc.frasco;
    DB.batch([{op:'inc',col:'stock',id:'central__'+cp.med,data:{loc:'central',med:cp.med},n:qc},{op:'set',col:'compras',id:'CP'+uid8(),data:{ts:Date.now(),med:cp.med,ml:qc,nf:cp.nf,por:S.profile.nome}},
      lg('estoque','compra','Registrou compra de '+ml(qc)+' de '+mc.nome+(cp.nf?' ('+cp.nf+')':''),null,{med:cp.med,ml:qc,nf:cp.nf})]);
    S.compra.nf='';S.compra.frascos=1;toast('Entrada registrada na central');
  }
  else if(a==='apr'){var pp=v.split('|'),ap=byId(D.approvals,pp[0]);if(ap){resolveApproval(ap,pp[1]==='ok');toast(pp[1]==='ok'?'Aprovado':'Rejeitado')}}
  else if(a==='atender'){
    var ar=byId(D.approvals,v);if(ar&&ar.payload){S.env.dest=ar.payload.retiro;S.env.med=ar.payload.med;S.env.frascos=1;S.gtab='central';toast('Confira a quantidade e envie')}
  }
  else if(a==='medNew'){S.medEdit='novo'}
  else if(a==='medEdit'){S.medEdit=v}
  else if(a==='medCancel'){S.medEdit=null}
  else if(a==='medSave'){
    var nome=g('f-nome').trim(),fr=parseNum(g('f-frasco'));
    if(!nome||fr<=0){toast('Preencha o nome e o tamanho do frasco');return}
    var mid=S.medEdit==='novo'?'m'+uid8():S.medEdit,kg=parseNum(g('f-kgml')),fx=parseNum(g('f-fixo'));
    if(!kg&&!fx){toast('Informe o peso por mL ou a dose fixa');return}
    var mdata={nome:nome,cat:g('f-cat'),frasco:fr,preco:parseNum(g('f-preco')),kgMl:kg||null,fixo:fx||null,carencia:Math.round(parseNum(g('f-car'))),min:parseNum(g('f-min')),lote:g('f-lote').trim(),venc:new Date((g('f-venc')||isoDate(Date.now()))+'T12:00:00').getTime()};
    DB.batch([{op:'set',col:'meds',id:mid,data:mdata},lg('cadastro','medicamento_salvo',(S.medEdit==='novo'?'Cadastrou':'Alterou')+' o medicamento '+nome+' (frasco '+fr+' mL, '+brl(mdata.preco)+', lote '+mdata.lote+')',null,{med:mid})]);
    S.medEdit=null;toast('Medicamento salvo');
  }
  else if(a==='rtSave'){
    var arr=retiros().map(function(r){return {id:r.id,nome:r.nome,cabecas:r.cabecas||0}}),rn,rc;
    if(v==='novo'){
      rn=g('rt-n-novo').trim();rc=Math.round(parseNum(g('rt-c-novo')));
      if(!rn){toast('Digite o nome do retiro');return}
      arr.push({id:'r'+uid8(),nome:rn,cabecas:rc});
    }else{
      rn=g('rt-n-'+v).trim();rc=Math.round(parseNum(g('rt-c-'+v)));
      if(!rn){toast('O retiro precisa de um nome');return}
      arr.forEach(function(r){if(r.id===v){r.nome=rn;r.cabecas=rc}});
    }
    DB.batch([{op:'set',col:'fazendas',id:fidNow(),data:{retiros:arr}},lg('cadastro','retiro_salvo',(v==='novo'?'Cadastrou':'Alterou')+' o retiro '+rn+' ('+rc+' animais)',null,{})]);
    toast('Retiro salvo');
  }
  else if(a==='seed'){DB.batch(seedOps(fidNow(),false).concat([lg('cadastro','dados_exemplo','Carregou os dados de exemplo',null,{})]));toast('Dados de exemplo carregados')}
  else if(a==='clearTest'){var co=clearTestOps();if(co.length){co.push(lg('cadastro','dados_exemplo_apagados','Apagou os lançamentos, transferências e aprovações de exemplo',null,{}));DB.batch(co);toast('Dados de exemplo apagados')}else toast('Não há dados de exemplo para apagar')}
  else if(a==='alNew'){
    var anome=g('al-nome').trim(),aemail=g('al-email').trim(),asenha=g('al-senha');
    if(!anome||!aemail){toast('Preencha o nome e o e-mail');return}
    if(asenha.length<6){toast('A senha precisa ter 6 ou mais caracteres');return}
    createResponsavel(anome,aemail,asenha,[],'almoxarife');return;
  }
  else if(a==='eqNew'){
    var enome=g('eq-nome').trim(),eemail=g('eq-email').trim(),esenha=g('eq-senha'),rets=[];
    document.querySelectorAll('.eq-r').forEach(function(c){if(c.checked)rets.push(c.value)});
    if(!enome||!eemail){toast('Preencha o nome e o e-mail');return}
    if(esenha.length<6){toast('A senha precisa ter 6 ou mais caracteres');return}
    if(!rets.length){toast('Escolha pelo menos um retiro');return}
    createResponsavel(enome,eemail,esenha,rets);return;
  }
  else if(a==='eqSave'){
    var rs2=[];document.querySelectorAll('[data-eqr="'+v+'"]').forEach(function(c){if(c.checked)rs2.push(c.value)});
    var uu=byId(D.users,v);if(!uu)return;
    if(!rs2.length){toast('Escolha pelo menos um retiro');return}
    DB.batch([{op:'set',col:'users',id:v,data:{retiros:rs2}},lg('equipe','usuario_retiros','Alterou os retiros de '+uu.nome+': '+rs2.map(retiroNome).join(', '),null,{uid:v,retiros:rs2})]);toast('Retiros salvos');
  }
  else if(a==='eqBlock'||a==='eqUnblock'){
    var u3=byId(D.users,v);if(!u3)return;var bl=a==='eqBlock';
    DB.batch([{op:'set',col:'users',id:v,data:{status:bl?'bloqueado':'ativo'}},lg('equipe',bl?'usuario_bloqueado':'usuario_reativado',(bl?'Bloqueou':'Reativou')+' o acesso de '+u3.nome,null,{uid:v})]);toast(bl?'Acesso bloqueado':'Acesso reativado');
  }
  else if(a==='eqReset'){
    var u4=byId(D.users,v);if(!u4)return;
    if(DEMO)toast('No modo teste não envia e-mail');
    else firebase.auth().sendPasswordResetEmail(u4.email).then(function(){toast('Link enviado para '+u4.email)}).catch(function(e){toast(authErr(e))});
    return;
  }
  else if(a==='hgrupo'){S.histGrupo=v;S.histN=100}
  else if(a==='hmais'){S.histN+=100}
  else if(a==='fzOk'){
    var uf=byId(D.users,v);if(!uf)return;
    var nfid='f'+uid8();
    DB.batch([{op:'set',col:'fazendas',id:nfid,data:{nome:uf.fazendaNome,status:'ativa',criadoEm:Date.now(),gerenteUid:uf.id,retiros:[],lotes:[]}},
      {op:'set',col:'users',id:uf.id,data:{status:'ativo',fazendaId:nfid}},
      lg('cadastro','fazenda_liberada','Liberou a fazenda '+uf.fazendaNome+' para o gerente '+uf.nome,null,{},nfid)]);
    toast('Fazenda liberada');
  }
  else if(a==='fzNo'){var ur=byId(D.users,v);if(ur){DB.batch([{op:'set',col:'users',id:v,data:{status:'recusado'}}]);toast('Pedido recusado')}}
  else if(a==='fzBlock'||a==='fzUnblock'){
    var fz=byId(D.fazendas,v);if(!fz)return;var fb=a==='fzBlock';
    DB.batch([{op:'set',col:'fazendas',id:v,data:{status:fb?'bloqueada':'ativa'}},lg('cadastro',fb?'fazenda_bloqueada':'fazenda_reativada',(fb?'Bloqueou':'Reativou')+' a fazenda '+fz.nome,null,{},v)]);
    toast(fb?'Fazenda bloqueada':'Fazenda reativada');
  }
  else if(a==='fzOpen'){S.fid=v;S.view='ger';S.gtab='painel';S.tab='home';S.asRetiro=null;startSubs()}
  else if(a==='fzTest'){
    var tf='f'+uid8(),tnome='Fazenda Teste '+dstr(Date.now());
    var tops=[{op:'set',col:'fazendas',id:tf,data:{nome:tnome,status:'ativa',criadoEm:Date.now(),gerenteUid:null,teste:true}}].concat(seedOps(tf,true));
    tops.push(lg('cadastro','fazenda_teste','Criou a fazenda de teste '+tnome,null,{},tf));
    DB.batch(tops);toast('Fazenda de teste criada');
  }
  render(true);
});
document.addEventListener('submit',function(ev){if(ev.target.id==='lform'){ev.preventDefault();doLogin()}});
document.addEventListener('input',function(ev){
  var t=ev.target,w=S.wiz;
  if(t.id==='brinco'&&w){w.brinco=t.value.replace(/\D/g,'').slice(0,15);render()}
  else if(t.id==='lnome'&&w){w.loteNome=t.value;render()}
  else if(t.id==='busca'&&w){w.q=t.value;render()}
  else if(t.id==='perda-q'){S.perdaQ=t.value}
  else if(t.id==='c-nf'){S.compra.nf=t.value}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='g-dest'){S.env.dest=t.value}
  else if(t.id==='g-med'){S.env.med=t.value;S.env.frascos=1}
  else if(t.id==='c-med'){S.compra.med=t.value;S.compra.frascos=1}
  else if(t.id==='as-ret'){S.asRetiro=t.value;S.wiz=null}
  else if(t.id==='h-ret'){S.histRet=t.value;S.histN=100}
  else return;
  render(true);
});
window.addEventListener('online',function(){render(true)});
window.addEventListener('offline',function(){render(true)});

/* ================= início ================= */
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
if(DEMO){if(DB.isEmpty())seedDemo()}
else{bootFirebase()}
draw();
})();
</script>
<script>
/* Tela de abertura: logo da AIMEX AGRO por 3 segundos, sempre que o sistema abre ou recarrega. */
(function(){
  var el=document.getElementById('splash');if(!el)return;
  setTimeout(function(){el.classList.add('out');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},400)},3000);
})();
</script>
